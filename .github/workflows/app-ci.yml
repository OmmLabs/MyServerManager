name: Dashboard CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: .NET tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Restore and check package advisories
        run: dotnet restore ServerAppManager.slnx --locked-mode -p:NuGetAuditMode=all -warnaserror:NU1900,NU1903,NU1904
      - name: Build
        run: dotnet build ServerAppManager.slnx -c Release --no-restore
      - name: Test with simulated system commands
        run: dotnet test ServerAppManager.slnx -c Release --no-build --no-restore
      - name: Test Windows PowerShell desktop setup regressions
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/Desktop.Setup.Tests.ps1 -UnitOnly
