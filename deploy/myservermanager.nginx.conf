# Replace servermanager.example.com and both certificate paths for the new hostname.
server {
    listen 80;
    listen [::]:80;
    server_name servermanager.example.com;

    return 308 https://servermanager.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name servermanager.example.com;

    ssl_certificate     /etc/letsencrypt/live/servermanager.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/servermanager.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:5300;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 70s;
    }
}
